sonar.projectKey=temirovruslan_shift_easy
sonar.organization=temirovruslan

# Three applications in one repository. Naming the source roots keeps the
# analysis on code that is written here rather than generated or vendored.
sonar.sources=server/src,client/src,mobile/src,mobile/App.tsx
sonar.tests=server/src/tests,client/src

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,server/src/tests/**

# Generated, vendored or non-source files. The build output and the exported
# HTML documentation are artefacts, not code, and counting them distorts both
# the line count and the duplication figure.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,documentation/**,**/*.min.js,server/src/swagger.json,client/public/**,mobile/assets/**

# Coverage is produced by `npm run test:coverage` in each application.
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info
sonar.typescript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info

sonar.sourceEncoding=UTF-8
