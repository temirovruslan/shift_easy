name: SonarQube Cloud

# Runs after the checks, on the same events. Analysis is only meaningful with
# coverage attached, and coverage only exists once the suites have run.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Sonar attributes issues to the commit that introduced them, which
          # it cannot do from a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install
        run: npm run install:all

      # Both suites, both lcov reports. Without these Sonar reports 0% and the
      # coverage gate reads as a regression that never happened.
      - name: Server coverage
        run: npm --prefix server run test:coverage

      - name: Client coverage
        run: npm --prefix client run test:coverage

      - name: Analyze
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
