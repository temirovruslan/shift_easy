name: CI

on:
  pull_request:
  push:
    branches: [main]

# A burst of pushes should not queue behind itself; only the newest run of a
# branch is worth finishing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here publishes anything, so read access to the code is all it needs.
permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The suite runs against an in-memory mongod. Caching the binary keeps
      # every run from downloading it again.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Test
        working-directory: server
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-coverage
          path: server/coverage
          retention-days: 7

  client:
    name: Web client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Test
        working-directory: client
        run: npm run test:coverage

      # `build` runs `tsc -b` first, so this is the typecheck as well.
      - name: Build
        working-directory: client
        run: npm run build

      # The bundle this commit produces, kept so a reviewer can inspect what a
      # change actually ships rather than rebuilding it themselves.
      - name: Upload the bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-dist
          path: client/dist
          retention-days: 7
